/* 关掉歌词秀后：右列不存在，网格回弹成单列铺满 */
.skin-page.only-left{grid-template-columns:minmax(0,1fr)}
.skin-page.only-left .sk-col{max-width:none}
/* 单列时主窗口/列表别被拉得过宽，封顶 1100 居中，剩余部分由面板背景吸收 */
.skin-page.only-left .sk-col>section{max-width:100%}

/* 单列时让行高撑满，播放列表往下延伸填满整屏 */
.skin-page.only-left{grid-template-rows:minmax(0,100%)}
.skin-page.only-left .sk-col{height:100%;min-height:0}

/* 单列回弹再收一档：封顶 1100px 居中，避免主窗口/列表被拉得过宽 */
.skin-page.only-left .sk-col{max-width:1100px;width:100%;margin:0 auto}

/* 设置页：内容平台主页入口 */
.home-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home-url{font-size:11px;opacity:.62;font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em}
.ghost-btn.home-open{padding:3px 10px}

/* ══════════ 第二套桌面方案：左侧竖排导航 + 右侧内容 + 底部播放条 ══════════ */
/* ───────────────────── 桌面界面（第二套方案）─────────────────────
   结构照 QQ 音乐那种：左边一条歌单栏，右下播放条，配色走全局主题变量。
   皮肤界面（.skin 类）完全不参与这一段，改这里不会动到皮肤。 */
.app.desk-mode{display:block}
.desk{
  height:100%;min-height:0;display:flex;gap:10px;padding:10px;
  background:var(--bg);color:var(--txt);font-size:13px;
}

/* 侧栏 */
.desk-nav{flex:0 0 208px;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px 8px}
.dn-user{display:flex;align-items:center;gap:9px;padding:0 4px 12px}
.dn-ava{width:30px;height:30px;border-radius:50%;flex:0 0 30px;object-fit:cover}
.dn-id{display:flex;align-items:center;gap:5px;min-width:0}
.dn-id b{font-size:13.5px;font-weight:600;white-space:nowrap}
.dn-chip{font-size:9.5px;line-height:1.6;padding:0 4px;border-radius:3px;white-space:nowrap;
  border:1px solid var(--line);color:var(--dim)}
.dn-chip.gold{border-color:rgba(232,180,80,.55);color:#e8b450}
.dn-caret{margin-left:auto;width:22px;height:22px;border:0;border-radius:6px;background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dn-caret:hover{background:var(--hover);color:var(--txt)}

.dn-cards{display:flex;gap:8px;padding:0 2px 12px}
.dn-card{width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);background:var(--cover);
  background-position:center;background-size:cover;color:var(--dim);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.dn-card.on{border-style:solid;border-color:var(--acc2)}
.dn-card.add:hover{border-color:var(--acc2);color:var(--acc2)}

.dn-quick{display:flex;flex-direction:column;gap:1px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.dn-quick button{display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);font-size:12.5px;cursor:pointer;text-align:left}
.dn-quick button:hover{background:var(--hover)}
.dn-quick button.on{background:var(--sel);font-weight:600}
.dn-quick .dn-ico{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.dn-quick button.on .dn-ico{color:var(--acc2)}
.dn-quick .dn-lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-quick em{font-style:normal;font-size:11px;color:var(--dim)}

.dn-grp{display:flex;align-items:center;gap:6px;padding:11px 10px 6px;color:var(--dim);font-size:11.5px}
.dn-grp span{flex:1}
.dn-grp button{width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--dim);
  cursor:pointer;font-size:13px;line-height:1}
.dn-grp button:hover{background:var(--hover);color:var(--acc2)}

.dn-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding-bottom:4px}
.dn-plist{display:flex;flex-direction:column;gap:1px}
.dn-scroll::-webkit-scrollbar{width:6px}
.dn-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.dn-plist button{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);cursor:pointer;text-align:left;min-width:0}
.dn-plist button:hover{background:var(--hover)}
.dn-plist button.on{background:var(--sel);font-weight:600}
.dn-pl-cover{width:26px;height:26px;flex:0 0 26px;border-radius:5px;background:var(--cover) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.dn-pl-name{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-plist em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dn-empty{padding:6px 10px;font-size:11px;line-height:1.6;color:var(--dim)}
/* 自建歌单：条目 + hover 出现的删除、行内新建 */
.dn-pl{position:relative;display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);cursor:pointer;text-align:left;min-width:0}
.dn-pl:hover{background:var(--hover)}
.dn-pl.on{background:var(--sel);font-weight:600}
.dn-pl em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dn-pl-ren{margin-left:2px;width:16px;height:16px;flex:0 0 16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut,#8a97a8);
  background:transparent;opacity:0;transition:opacity .12s,background .12s}
.dn-pl:hover .dn-pl-ren{opacity:.85}
.dn-pl-ren:hover{background:rgba(90,150,255,.18);color:#4b8bff;opacity:1}
.dn-pl-del{margin-left:2px;width:16px;height:16px;flex:0 0 16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;opacity:0}
.dn-pl:hover .dn-pl-del{opacity:.85}
.dn-pl-del:hover{background:rgba(255,90,100,.2);color:#ff8a8a;opacity:1}
.dn-pl-del.confirm{opacity:1;width:auto;flex:0 0 auto;padding:0 6px;background:#ff4d5e;color:#fff;font-size:10px}
.dn-newpl{display:flex;gap:5px;padding:4px 8px 7px}
.dn-newpl input{flex:1;min-width:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line);
  background:var(--input);color:var(--txt);font-size:11.5px;outline:none}
.dn-newpl input:focus{border-color:var(--acc2)}
.dn-newpl button{padding:0 9px;border:0;border-radius:6px;background:var(--acc);color:var(--on-acc-text);
  font-size:11px;font-weight:600;cursor:pointer;flex:0 0 auto}

/* 列表行尾「加入歌单」 */
.row .addpl{padding:0 7px;border:1px solid transparent;border-radius:6px;background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.row .addpl:hover{color:var(--acc2);border-color:var(--line);background:var(--hover)}
.thead>span:nth-child(8){flex:0 0 28px}

/* 「加入歌单」浮层 */
.plmenu-mask{position:fixed;left:0;top:0;right:0;bottom:0;z-index:80}
.plmenu{position:fixed;z-index:81;width:196px;max-height:268px;overflow-y:auto;padding:8px;
  display:flex;flex-direction:column;gap:2px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.34)}
.plmenu-t{font-size:11px;color:var(--dim);padding:2px 6px 5px}
.plmenu button{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;border:0;border-radius:6px;
  background:transparent;color:var(--txt);font-size:12px;cursor:pointer;text-align:left}
.plmenu button:hover{background:var(--hover)}
.plmenu button span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plmenu button em{font-style:normal;font-size:10.5px;color:var(--dim);flex:0 0 auto}
.plmenu button.has{color:var(--dim)}
.plmenu-new{margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 6px 6px;padding-top:8px !important;color:var(--acc2) !important;font-weight:600}
.plmenu-empty{padding:6px 8px 4px;font-size:11px;color:var(--dim)}

.dn-foot{margin-top:6px;padding-top:8px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:2px}
.dn-foot button{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.dn-foot button:hover{background:var(--hover);color:var(--acc2)}

/* 主区 */
.desk-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.desk-top{display:flex;align-items:center;gap:8px;padding:4px 6px;flex:0 0 auto}
.dt-round{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--line);border-radius:50%;
  background:var(--input);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dt-round:hover{color:var(--acc2);border-color:var(--acc2)}
.desk-search{display:flex;gap:6px;flex:0 1 420px;margin-left:6px}
.desk-search input{flex:1;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:16px;
  background:var(--input);color:var(--txt);font-size:12.5px;outline:none}
.desk-search input:focus{border-color:var(--acc2)}
.desk-search button{padding:6px 16px;border:0;border-radius:16px;background:var(--acc);color:#04262c;
  font-size:12.5px;font-weight:600;cursor:pointer}
.desk-search button:disabled{opacity:.6}
.desk-top-right{margin-left:auto;display:flex;gap:6px}
.desk-top-right .ghost-btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--input);color:var(--dim);cursor:pointer}
.desk-top-right .ghost-btn:hover{color:var(--acc2);border-color:var(--acc2)}
.dt-theme{font-size:13px;line-height:1}

.desk-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.desk-body .main{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:1180px;margin:0 auto}
.desk-body .main::-webkit-scrollbar{width:9px}
.desk-body .main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}
.desk-body .main::-webkit-scrollbar-track{background:transparent}

/* 歌单头（只在「我的收藏 / 某张专辑」时出现） */
.dpl-hero{display:flex;gap:18px;align-items:center;padding:4px 2px 16px;flex:0 0 auto;width:100%;max-width:1180px;margin:0 auto}
.dpl-cover{width:120px;height:120px;flex:0 0 120px;border-radius:50%;
  background:var(--cover) center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  font-size:34px;color:var(--dim);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.dpl-info{min-width:0;display:flex;flex-direction:column;gap:8px}
.dpl-info h2{font-size:22px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpl-info p{font-size:12px;color:var(--dim)}
.dpl-btns{display:flex;gap:10px;margin-top:4px}
.dpl-btns button{padding:7px 18px;border-radius:16px;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.dpl-main{background:var(--acc);color:#04262c;font-weight:600}
.dpl-main:hover{filter:brightness(1.06)}
.dpl-sub{border-color:var(--line);background:var(--input);color:var(--txt)}
.dpl-sub:hover{border-color:var(--acc2);color:var(--acc2)}
.dpl-btns button:disabled{opacity:.45;cursor:default}

/* 歌单排序条：拖动排序 / 按时间 / 按名称 / 按拼音。拖动那一档只在自建歌单里出现 */
.dpl-sort{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.dpl-sort button{padding:5px 13px;border-radius:14px;font-size:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--input);color:var(--dim)}
.dpl-sort button:hover{border-color:var(--acc2);color:var(--acc2)}
.dpl-sort button.on{background:var(--acc);border-color:var(--acc);color:#0a1a20;font-weight:600}
.dpl-sort-tip{font-size:11.5px;color:var(--dim)}

/* 拖动排序：整行可拖，左边「握把」只是提示（不吃事件，避免挡住播放按钮） */
.row.can-drag{cursor:grab}
.row.can-drag:active{cursor:grabbing}
.dgrip{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:8px;
  display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;
  color:var(--dim);opacity:.34;pointer-events:none;transition:opacity .12s}
.row.can-drag:hover .dgrip{opacity:.9}
.row.drag-src{opacity:.35}
.row.drop-on{box-shadow:inset 0 2px 0 var(--acc)}

/* 底部播放条 */
.desk-now{flex:0 0 auto;display:grid;grid-template-columns:minmax(180px,1fr) minmax(360px,2fr) 110px;
  align-items:center;gap:16px;padding:10px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px}
.dnp-song{display:flex;align-items:center;gap:10px;min-width:0}
.dnp-cover{width:44px;height:44px;flex:0 0 44px;border-radius:6px;
  background:var(--cover) center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--dim)}
/* 底栏这枚小封面就是当前播放的专辑封面，点它推开「正在播放」全屏页 */
.dnp-cover.can-open{cursor:pointer;transition:transform .14s,box-shadow .14s}
.dnp-cover.can-open:hover{transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.dnp-cover.can-open:active{transform:scale(1.01)}
.dnp-meta{min-width:0;display:flex;flex-direction:column}
.dnp-meta b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnp-meta em{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnp-heart{border:0;background:transparent;color:var(--heart);font-size:16px;cursor:pointer;padding:0 2px;flex:0 0 auto}
.dnp-heart.on{color:var(--heart-on)}

.dnp-center{display:flex;flex-direction:column;gap:6px;min-width:0}
.dnp-btns{display:flex;align-items:center;justify-content:center;gap:14px}
.dnp-ico{border:0;background:transparent;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 4px}
.dnp-ico:hover,.dnp-ico.on{color:var(--acc2)}
.dnp-play{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:#04262c;
  font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dnp-play:hover{filter:brightness(1.08)}
.dnp-vol{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.dnp-vol svg{flex:0 0 14px;opacity:.85}
.dnp-vol input{width:78px}
.dnp-prog{display:flex;align-items:center;gap:8px;width:100%;max-width:560px;margin:0 auto}
.dnp-prog span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.dnp-prog input{flex:1;min-width:0}

.dnp-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.dnp-right button{min-width:32px;height:26px;padding:0 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--input);color:var(--dim);font-size:12px;cursor:pointer}
.dnp-right button:hover{color:var(--acc2);border-color:var(--acc2)}

/* 桌面模式里的列表：行更高、封面圆角、右侧心形 */
.desk .row{padding:7px 8px;border-radius:8px}
.desk .row:hover{background:var(--hover)}
.desk .row.on{background:var(--sel)}
.desk .head.hd-library{display:none}
.desk .cover{width:38px;height:38px;flex:0 0 38px;border-radius:6px}
.desk .row{min-height:52px}
.desk .info{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr)}
.desk .thead .tinfo{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr)}
.desk-body .head{align-items:flex-start}
.desk-body .head h1{font-size:17px;font-weight:600}
.desk-body .head p{font-size:11.5px;color:var(--dim)}

.desk input[type=range]{accent-color:var(--acc);-webkit-appearance:none;appearance:none;
  height:16px;background:transparent;cursor:pointer}
.desk input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
.desk input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;
  border-radius:50%;background:var(--acc);border:0;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.desk input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.desk input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--acc)}

.app.mini-mode > .desk{display:none}
.desk .row.on{background:var(--sel)}

/* 桌面顶栏图标按钮 */
.desk-top-right .ghost-btn.icon-only{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:32px;padding:0}
.desk-top-right .ghost-btn.icon-only svg{display:block}
/* 侧栏底部：衣服图标 + 文字 */
.desk-switch{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.desk-switch svg{flex:0 0 auto}

/* ══════════ 桌面版歌词界面 ══════════ */
.dlp{display:flex;flex-direction:column;min-height:0;flex:1;padding:6px 4px 0}
.dlp-head{display:flex;align-items:center;gap:14px;padding:0 4px 10px;flex:0 0 auto}
.dlp-song{display:flex;flex-direction:column;min-width:0}
.dlp-song b{font-size:16px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlp-song em{font-style:normal;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlp-tools{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.dlp-tools button{padding:5px 13px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--txt);font:12px inherit;font-family:inherit;cursor:pointer}
.dlp-tools button:hover{border-color:var(--acc)}
.dlp-tools button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dlp-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;padding:24px 12px}
.dlp-kara{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.dlp-prev,.dlp-next{font-size:16px;line-height:1.6;color:var(--dim);opacity:.62;text-align:center;max-width:1000px}
.dlp-now{font-size:30px;line-height:1.45;font-weight:600;text-align:center;max-width:1040px;color:var(--txt)}
.dlp-none{font-size:13px;color:var(--dim)}
.dlp .ln{font-size:15px;line-height:1.95;color:var(--dim);text-align:center;width:100%;max-width:1000px}
.dlp .ln.on{font-size:19px;font-weight:600;color:var(--txt)}
.dlp .kowrap{position:relative;display:inline-block;max-width:100%}
.dlp .kbase{color:inherit}
.dlp .kfill{position:absolute;left:0;top:0;white-space:nowrap;overflow:hidden;color:var(--acc);pointer-events:none}
.dlp-body::-webkit-scrollbar{width:10px}
.dlp-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:content-box}
.dlp-body::-webkit-scrollbar-track{background:transparent}

/* 插件账号卡片的提示与报错 */
.acct-hint{margin:8px 0 0;font-size:12px;color:var(--dim)}
.acct-err{margin:8px 0 0;font-size:12px;color:#c0392b;line-height:1.6;word-break:break-word}

/* ---------- MyGo 宿主：窗口无边框，页面自己画顶部拖动条 ---------- */
/* mygo-music 那边窗口是 Frameless 的，没有系统标题栏，所以这里补一条 30px 的条：
   空白处拖动窗口，右边是最小化/关闭。Wails 版没有 window.mygo，body 不会带这个类。 */
body.mygo-frameless .app{box-sizing:border-box;padding-top:30px}
body.mygo-frameless .app.mini-mode{padding-top:0;background:transparent}
body.qq-mini{background:transparent}
body.mygo-frameless:has(.app.mini-mode){background:transparent}

.mygo-dragbar{position:fixed;left:0;right:0;top:0;height:30px;display:flex;align-items:center;
  padding:0 84px 0 12px;background:var(--panel);border-bottom:1px solid var(--line);
  color:var(--dim);font-size:12px;z-index:60;--app-region:drag}
.mygo-bar-title{flex:1;line-height:30px;letter-spacing:.5px;user-select:none}
/* 窗口按钮单独一层，绝不做 drag 容器的子元素：--app-region 会继承，按钮跟着变 drag
   的话，点击会被 mygo 当成拖窗户，click 根本到不了 onClick。 */
.mygo-winctl{position:fixed;top:0;right:6px;height:30px;display:flex;align-items:center;gap:2px;
  z-index:70;--app-region:no-drag}
.mygo-win-btn{width:34px;height:24px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;
  color:var(--dim);cursor:pointer;border-radius:4px;font-size:13px;line-height:1;padding:0}
.mygo-win-btn:hover{background:var(--hover);color:var(--txt)}
.mygo-win-btn.close:hover{background:#e04b3a;color:#fff}

/* 葫芦窗口（mygo-music 加装的皮肤/迷你窗口）：迷你卡的拖动交给 mygo 的
   --app-region，窗口自己就是 348×124，不需要前端再算位移。 */
body.qq-owned .mini-player{ --app-region: drag }
body.qq-owned .mini-card{ cursor: default }

/* ---------- 主面板「首页」：插件 home() 的分区 ---------- */
.home{display:flex;flex-direction:column;gap:18px;padding:2px 2px 18px}
.home-head{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.home-head .home-actions{margin-left:auto}
.home-headrow-none{}
.home-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;position:sticky;top:-12px;z-index:3;background:var(--bg);padding:6px 0}
.home-tabs{display:flex;gap:6px;overflow-x:auto;min-width:0}
.home-tabs button{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.home-tabs button.on{color:var(--txt);border-color:var(--acc);background:var(--sel)}
.home-actions{display:flex;gap:8px;flex:0 0 auto}
.home-btn{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.home-btn:hover{color:var(--txt);border-color:var(--acc);background:var(--hover)}
.home-btn.primary{color:var(--txt);border-color:var(--acc);background:var(--sel)}
.home-btn:disabled{opacity:.6;cursor:default}
.home-title{margin:0;font-size:17px;font-weight:600;color:var(--txt)}
.home-sec{display:flex;flex-direction:column;gap:10px}
.home-sec-h{display:flex;align-items:center;gap:10px;min-width:0}
.home-sec-h h3{margin:0;font-size:14.5px;font-weight:600;color:var(--txt);white-space:nowrap}
.home-sub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px}
.home-card{flex:0 0 148px;display:flex;flex-direction:column;gap:6px;border:none;background:transparent;color:inherit;text-align:left;cursor:pointer;padding:0}
.home-card:hover .home-cover{transform:scale(1.03);border-color:var(--acc)}
.home-cover{width:148px;height:148px;border-radius:12px;background:var(--cover) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px;
  border:1px solid var(--line);transition:transform .16s,border-color .16s}
.home-name{font-size:13px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-artist{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-detail-h{display:flex;align-items:center;gap:10px}
.home-detail-h h3{margin:0;font-size:15px;font-weight:600}
.home-count{font-size:12px;color:var(--dim)}
.home-list{display:flex;flex-direction:column;gap:2px}
.home-tr{display:grid;grid-template-columns:34px 1fr 170px 46px;align-items:center;gap:10px;
  border:none;background:transparent;color:var(--txt);padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left}
.home-tr:hover{background:var(--hover)}
.home-tr-cover{width:34px;height:34px;border-radius:7px;background:var(--cover) center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
.home-tr-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-tr-sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-tr-dur{font-size:12px;color:var(--dim);text-align:right}
.home-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--dim);padding:48px 0;font-size:13px;text-align:center}
.home-empty.inline{align-items:flex-start;padding:8px 0}
.home-empty b{color:var(--txt);font-size:14px}
.home-err{color:#e06c5a;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}

/* ---------- 左右边缘拖宽（无边框窗口自己画）---------- */
.app{position:relative}
.edge-resize{position:absolute;top:0;bottom:0;width:8px;z-index:80;cursor:ew-resize;
  --app-region:no-drag;background:transparent}
.edge-resize.left{left:0}
.edge-resize.right{right:0}
.edge-resize:hover{background:var(--acc);opacity:.28}
body.edge-resizing{cursor:ew-resize;user-select:none}

/* 侧栏顶部：音源下拉选择器 */
.dnp{padding:0 0 10px;gap:2px;position:relative}
.dnp-box{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:4px 5px;border-radius:9px;
  cursor:pointer;border:0;background:transparent;color:var(--txt);text-align:left;font:inherit}
.dnp-box:hover{background:var(--hover)}
.dnp-caret{margin-left:auto;color:var(--dim);flex:0 0 12px;transition:transform .16s}
.dnp-mask{position:fixed;inset:0;z-index:55}
.dnp-menu{position:absolute;top:calc(100% - 6px);left:2px;right:2px;z-index:60;padding:5px;
  background:var(--card,#fff);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 14px 34px rgba(28,18,8,.18);max-height:280px;overflow:auto}
.dnp-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;border-radius:8px;
  background:transparent;color:var(--txt);font-size:12.5px;cursor:pointer;text-align:left}
.dnp-menu button:hover{background:var(--hover)}
.dnp-menu button.on{background:var(--sel)}
.dnp-menu .dnp-badge.sm{width:24px;height:24px;flex:0 0 24px;font-size:12px}
.dnp-menu .dnp-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnp-menu .dnp-tick{margin-left:auto;color:var(--acc);font-size:12px}
.dnp-badge{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffab53,#e5661c);color:#fff;font-size:14.5px;font-weight:700;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.dnp-id{min-width:0;display:flex;flex-direction:column;gap:2px}
.dnp-id b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86px}
.dnp-sub{font-size:9.5px;color:var(--dim);white-space:nowrap}

/* 歌单多选与批量操作 */
.selchk{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;
  cursor:pointer;margin-right:2px;transition:background .12s,border-color .12s}
.selchk:hover{border-color:var(--acc)}
.selchk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dpl-bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.dpl-bulk-n{font-size:11.5px;color:var(--dim);min-width:84px}
.dpl-bulk button{border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:8px;
  padding:4px 10px;font-size:12px;cursor:pointer}
.dpl-bulk button:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.dpl-bulk button:disabled{opacity:.45;cursor:default}
.dpl-bulk .dpl-bulk-del.on{color:#e05a3a;border-color:#e05a3a}
.dpl-sub.on{color:var(--txt);border-color:var(--acc);background:var(--sel)}

/* ══════════ 窄窗口断点（放在最后，覆盖前面 .skin-page/.sk-pl 的固定写法）══════════
   窗口被缩到一半左右时，两列皮肤会互相挤压：左列按钮和搜索框挤成一行、右列歌词被压成一条。
   窄屏统一改成单列：歌词不再并排，整块堆到播放列表下面；工具条允许换行。 */
@media (max-width:860px){
  .skin-page{display:flex;flex-direction:column;gap:6px;padding:6px;height:auto;min-height:100vh;overflow-x:hidden}
  /* 单列时面板别铺满整屏，封顶 760 居中，两侧由面板底色吸掉 */
  .sk-win,.sk-eq,.sk-lyr,.sk-pl{width:100%;max-width:660px;margin-left:auto;margin-right:auto}
  .skin-page .sk-col{flex:1 1 auto;height:auto;min-height:0;gap:6px}
  .skin-page .sk-col-r{flex:0 0 auto;height:auto;min-height:0;overflow:visible}
  .skin-page .sk-pl{flex:1 1 auto;min-height:340px;overflow:hidden}
  .skin-page .sk-pl .main{flex:1 1 auto;min-height:0}
  .skin-page .sk-col-r .sk-lyr{flex:0 0 auto;height:auto;min-height:150px;max-height:34vh}
  /* 窄屏下让两列容器「透明」，四块面板直接由 .skin-page 排：主 → 均衡器 → 歌词 → 列表，
     和参考样张（TTPLAYER）的面板顺序一致 */
  .skin-page .sk-col,.skin-page .sk-col-r{display:contents}
  .sk-win{order:1}
  .sk-eq{order:2}
  .sk-lyr{order:3}
  .sk-pl{order:4}
  .sk-side{width:150px}
  .sk-tools{flex-wrap:wrap;gap:4px}
  .sk-tools .sk-search{width:100%;margin-left:0;order:9}
  .sk-eq-faders{gap:2px}
}
/* 再窄一档（缩到 760 以下）：均衡器的推子改横向滚动，别把面板撑破 */
@media (max-width:760px){
  .skin-page{padding:4px;gap:4px}
  .sk-eq-faders{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
  .sk-eq-row{width:80px}
  .sk-win,.sk-eq,.sk-pl{min-width:0}
  .sk-mini-btns button{width:32px}
  .sk-vol{width:80px}
}

/* ══════════ 再窄一档（≈460px，窗口缩到一张竖屏截图的宽度）══════════
   目标：工具条的 8 个选项卡 + 搜索框挤在一行不换行，均衡器 10 段推子整排可见不出现横向滚动。 */
@media (max-width:560px){
  /* 最小尺寸（≈460×1043）下的比例：控件比「勉强塞下」稍大一档，更贴近参考截图 */
  .skin-page{padding:5px;gap:5px}
  .sk-body{gap:6px}
  .sk-side{width:146px}
  .sk-tools{padding:5px 5px;gap:3px;flex-wrap:wrap}
  .sk-tools button{height:23px;padding:0 6px;font-size:10.5px;letter-spacing:0;flex:0 1 auto;min-width:0}
  .sk-tools .sk-search{width:104px;margin-left:auto;order:0;gap:2px}
  .sk-tools .sk-search input{height:23px;padding:0 4px;font-size:10px}
  .sk-tools .sk-search button{padding:0 5px;height:23px}
  .sk-eq-body{gap:6px;padding:6px 6px 8px}
  .sk-eq-row{width:72px;gap:5px}
  .sk-eq-row .lab{font-size:9px;margin-bottom:-3px;white-space:nowrap}
  .sk-eq-row input{height:6px}
  .sk-eq-faders{padding:12px 4px 4px 24px;gap:0;overflow:visible}
  .sk-eq-faders .scale{left:2px;font-size:8px}
  .sk-fader{width:17px;min-height:104px}
  .sk-fader .hz{font-size:7.5px;letter-spacing:0}
  .sk-controls{gap:4px}
  .sk-vol{width:80px;gap:4px}
  .sk-mini-btns button{height:16px;padding:0 6px;font-size:9px}
  .sk-wb{width:19px;height:19px;font-size:10px}
}

/* ══════════════════════════════════════════════════════
   第七套：护眼绿（data-skin="green"）——浅豆沙绿底、深绿控件
   ══════════════════════════════════════════════════════ */
.skin[data-skin="green"]{background:#b7d5b4}
.skin[data-skin="green"] .skin-page{background:linear-gradient(180deg,#d9ecd5,#aecbab)}
.skin[data-skin="green"] .sk-panel{
  background:linear-gradient(180deg,#f0f9ec 0%,#dce8d8 42%,#c4dbc0 100%);
  border-color:#8aa888;color:#1c3324;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(60,90,60,.3),0 3px 9px rgba(40,70,45,.26)}
.skin[data-skin="green"] .sk-title{
  background:linear-gradient(180deg,#315f3d 0%,#1e4128 55%,#12291a 100%);
  border-bottom-color:#0d1f12;color:#c9f6cf;text-shadow:0 0 6px rgba(110,230,140,.45);letter-spacing:.06em}
.skin[data-skin="green"] .sk-title .sk-time{color:#b8ffc0;font-weight:600;text-shadow:0 0 7px rgba(120,240,150,.5)}
.skin[data-skin="green"] .sk-wb{background:linear-gradient(180deg,#f6fcf3,#dcebd8 58%,#c1d7bd);
  border-color:#8aa888;color:#17321f;text-shadow:none}
.skin[data-skin="green"] .sk-spec{background:linear-gradient(180deg,#0c2114,#06160c);
  border-color:#22402b;box-shadow:inset 0 0 12px rgba(0,0,0,.72)}
.skin[data-skin="green"] .sk-spec i{background:linear-gradient(180deg,#e8ffe9 0%,#5fe483 38%,#1f9b4f 100%);
  box-shadow:0 0 6px rgba(90,230,130,.5)}
.skin[data-skin="green"] .sk-line{color:#2f7a4b}
.skin[data-skin="green"] .sk-line .k{color:#5f9170}
.skin[data-skin="green"] .sk-line .v{color:#17402a}
.skin[data-skin="green"] .sk-status{color:#2f7a4b}
.skin[data-skin="green"] .sk-led{background:#2fd66a;box-shadow:0 0 8px #2fd66a}
.skin[data-skin="green"] .sk-led.off{background:#3c5d47;box-shadow:none}
.skin[data-skin="green"] .sk-mini-btns button{background:linear-gradient(180deg,#f2f9ee,#cfe2ca 55%,#a8c3a4);
  border-color:#7e9a7c;color:#17321f;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.skin[data-skin="green"] .sk-mini-btns button.on{background:linear-gradient(180deg,#b9f7c9,#4bcb74 55%,#13753c);color:#04170c}
.skin[data-skin="green"] .sk-seek .tt{color:#2f7a4b}
.skin[data-skin="green"] .sk-seek input{background:linear-gradient(180deg,#1a3a24,#0d2416);border-color:#0a1c10}
.skin[data-skin="green"] .sk-seek input::-webkit-slider-thumb{background:linear-gradient(180deg,#f4fbf1,#c9dcc5 55%,#94ad91);border-color:#6b8669}
.skin[data-skin="green"] .sk-ctl{background:radial-gradient(circle at 50% 22%,#f8fdf5,#c9dcc5 55%,#8ea78b);
  border-color:#6b8669;color:#12301c;box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 2px 4px rgba(20,45,25,.45)}
.skin[data-skin="green"] .sk-ctl.play{background:radial-gradient(circle at 50% 22%,#dcffe4,#5fdc86 55%,#116b36)}
.skin[data-skin="green"] .sk-pl-btn{background:linear-gradient(180deg,#f2f9ee,#cfe2ca 55%,#a8c3a4);
  border-color:#7e9a7c;color:#17321f;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.skin[data-skin="green"] .sk-vol input{background:#123021;border-color:#0a1c10}
.skin[data-skin="green"] .sk-vol input::-webkit-slider-thumb{background:linear-gradient(180deg,#f4fbf1,#c9dcc5 55%,#94ad91);border-color:#6b8669}
.skin[data-skin="green"] .sk-eq-on button{background:linear-gradient(180deg,#f2f9ee,#cfe2ca 55%,#a8c3a4);
  border-color:#7e9a7c;color:#17321f;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.skin[data-skin="green"] .sk-eq-on button.on{background:linear-gradient(180deg,#b9f7c9,#42c96d 55%,#116b36);color:#04170c}
.skin[data-skin="green"] .sk-eq-row .lab{color:#5f9170}
.skin[data-skin="green"] .sk-eq-row input{background:#123021;border-color:#0a1c10}
.skin[data-skin="green"] .sk-eq-row input::-webkit-slider-thumb{background:linear-gradient(180deg,#f4fbf1,#c9dcc5 55%,#94ad91);border-color:#6b8669}
.skin[data-skin="green"] .sk-eq-faders{background:linear-gradient(180deg,#0b2113,#0a2216);border-color:#22402b}
.skin[data-skin="green"] .sk-eq-faders .scale{color:#5f9170}
.skin[data-skin="green"] .sk-fader .track{background:linear-gradient(180deg,#0b2417,#04120b);border-radius:2px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.75)}
.skin[data-skin="green"] .sk-fader .knob{background:linear-gradient(180deg,#f6fcf2,#c9dcc5 55%,#8ea78b);
  border-color:#6b8669;box-shadow:0 1px 2px rgba(0,0,0,.55)}
.skin[data-skin="green"] .sk-tools{background:linear-gradient(180deg,#cfe4ca,#b2cdaf 60%,#9dba99);border-bottom-color:#8aa888}
.skin[data-skin="green"] .sk-tools button{background:linear-gradient(180deg,#f6fcf2,#d7e8d2 55%,#b1c9ad);
  border-color:#7e9a7c;color:#17321f;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.skin[data-skin="green"] .sk-tools button.on{background:linear-gradient(180deg,#c4fad3,#4dd47a 55%,#13753c);color:#04170c}
.skin[data-skin="green"] .sk-vis{--vis-lo:#1f8f4f;--vis-mid:#42d98a;--vis-hi:#e8ffe9;
  --vis-line:#2f7a4b;--vis-dial:#2f7a4b;--vis-needle:#c0392b;--vis-dim:#7fa98b;--vis-hot:#d93b2d}

/* ══════════ 再窄一档（≈460px，竖屏长条 460×1043）══════════
   上一档 560 的规则是按「刚好塞下」写的，453~460 宽时工具条仍会顶出去、
   均衡器最后一根 16k 推子贴边被切。这一档把整体再收一档比例，
   并把工具条改成两行：8 个选项卡一行，搜索框独占一行。 */
@media (max-width:480px){
  .skin-page{padding:4px;gap:4px}
  .sk-panel{border-radius:3px}
  /* 工具条：选项卡一行、搜索框另起一行 */
  .sk-tools{padding:4px 4px;gap:2px 2px;flex-wrap:wrap}
  .sk-tools button{height:22px;padding:0 5px;font-size:10px;letter-spacing:0;flex:0 0 auto}
  .sk-tools .sk-search{flex:0 0 100%;width:auto;max-width:none;margin-left:0;order:9;gap:3px}
  .sk-tools .sk-search input{height:22px;font-size:10.5px;padding:0 5px;flex:1 1 auto;min-width:0}
  .sk-tools .sk-search button{height:22px;padding:0 8px;font-size:10.5px}
  /* 主面板右栏 */
  .sk-side{width:120px;gap:4px}
  .sk-line{font-size:10px}
  .sk-status{font-size:9.5px}
  .sk-mini-btns{gap:2px}
  .sk-mini-btns button{height:15px;width:30px;font-size:9px;padding:0 4px}
  .sk-title{padding:2px 4px;gap:3px}
  .sk-title .t{font-size:11.5px}
  .sk-title .sk-time{font-size:10px}
  .sk-wb{width:17px;height:17px;font-size:9px}
  .sk-win-mini svg{width:10px;height:10px}
  .sk-gear{font-size:11.5px;line-height:1;display:block}
  /* 播放控制 */
  .sk-seek .tt{font-size:9px}
  .sk-controls{gap:3px;padding:5px 4px 2px}
  .sk-ctl{width:26px;height:26px;font-size:10.5px}
  .sk-ctl.big{width:36px;height:36px;font-size:14px}
  .sk-vol{width:72px;gap:3px}
  .sk-pl-btn{height:20px;font-size:9.5px;padding:0 6px}
  /* 均衡器 */
  .sk-eq-body{gap:5px;padding:5px 5px 6px}
  .sk-eq-row{width:58px;gap:4px}
  .sk-eq-row .lab{font-size:8.5px}
  .sk-eq-faders{padding:11px 2px 3px 18px;gap:0;overflow:visible}
  .sk-eq-faders .scale{left:1px;font-size:7px}
  .sk-fader{width:15px;min-height:96px}
  .sk-fader .hz{font-size:6.5px;letter-spacing:0}
  .sk-eq-faders .scale span{font-size:7px}
  /* 歌词秀 */
  .skin-page .sk-col-r .sk-lyr{flex:0 0 auto;height:auto;min-height:132px;max-height:34vh}
  .skin-page .sk-col-r .sk-lyr-body{min-height:104px}
  .sk-lyr-body{padding:7px 8px;min-height:110px}
  .sk-lyr-body .song{font-size:11.5px}
  .sk-lyr-body .meta{font-size:9px;margin-bottom:6px}
  .sk-lyr-body .ln{font-size:10.5px;line-height:1.9}
  .sk-lyr-body .ln.on{font-size:12px;text-shadow:0 0 6px rgba(150,160,255,.4)}
  .sk-lyr-body .none{font-size:10.5px}
  /* 播放列表 / 歌词 / 其余 */
  .sk-pl .main{padding:0 2px}
  .sk-tab-bar button, .pl-tabs button{font-size:10px;padding:0 5px}
  .sk-eq-on button{height:15px;font-size:9px;padding:0 5px}
}

/* 歌词正文：窗口宽的时候别让一行字拉得太长，封顶 520 居中 */
.skin-page .sk-col-r .sk-lyr-body{max-width:560px;margin-left:auto;margin-right:auto}

/* ── 按真实可用宽度切列（skinWide 判断）────────────────────────
   和下面 840px 断点是一套规则，只是改由 JS 按 window.innerWidth 判定，
   避免系统缩放时「看着窗口挺宽、实际 CSS 宽度不够」而一直单列。 */
.skin-page.one-col{display:flex;flex-direction:column;gap:6px;padding:6px;height:auto;min-height:0;overflow-x:hidden}
.skin-page.one-col .sk-col{flex:1 1 auto;height:auto;min-height:0;gap:6px}
.skin-page.one-col .sk-col-r{flex:0 0 auto;height:auto;min-height:0;overflow:visible}
.skin-page.one-col .sk-pl{flex:1 1 auto;min-height:340px;overflow:hidden}
.skin-page.one-col .sk-pl .main{flex:1 1 auto;min-height:0}
.skin-page.one-col .sk-col,.skin-page.one-col .sk-col-r{display:contents}
.skin-page.one-col .sk-win{order:1}
.skin-page.one-col .sk-eq{order:2}
.skin-page.one-col .sk-lyr{order:3}
.skin-page.one-col .sk-pl{order:4}
.skin-page.one-col .sk-win,.skin-page.one-col .sk-eq,.skin-page.one-col .sk-lyr,.skin-page.one-col .sk-pl{
  width:100%;max-width:660px;margin-left:auto;margin-right:auto}
.skin-page.one-col .sk-side{width:150px}
.skin-page.one-col .sk-tools{flex-wrap:wrap;gap:4px}
.skin-page.one-col .sk-tools .sk-search{width:100%;margin-left:0;order:9}
.skin-page.one-col .sk-eq-faders{gap:2px}
.skin-page.one-col .sk-col-r .sk-lyr{flex:0 0 auto;height:auto;min-height:150px;max-height:34vh}

/* 版本号小字 */
.sk-ver{font-size:9.5px;opacity:.5;letter-spacing:0;margin-right:4px}

/* 皮肤标题栏齿轮按钮（设置） */
.sk-set svg{width:10px;height:10px}

/* ── tt 亮橙皮肤补可读性 ──
   橙色面板上的浅色字只看得到轮廓（设置页、播放列表、右栏尤其严重），
   这里统一把皮肤界面里的正文、图标压成深棕。 */
.skin[data-skin="tt"] .sk-line{color:#3a1a00}
.skin[data-skin="tt"] .sk-line .k{color:#78400e}
.skin[data-skin="tt"] .sk-line .v{color:#2b1200}
.skin[data-skin="tt"] .sk-status{color:#5a2a02}
.skin[data-skin="tt"] .sk-wb{color:#5a2800}
.skin[data-skin="tt"] .sk-set svg{stroke:#5a2800}
.skin[data-skin="tt"] .sk-ctl{color:#4a2100}
.skin[data-skin="tt"] .sk-ctl.big.play{color:#5a2200}
.skin[data-skin="tt"] .sk-ver{color:#7a3a06}
.skin[data-skin="tt"] .sk-pl .main{color:#331700}

<!-- 开机自检：任何启动异常都显示在底部横条，避免白屏无从排查 -->
<script>
  (function () {
    var bar = document.createElement('div');
    bar.id = 'bootdiag';
    // 平时不显示；只有启动失败或运行时报错才把这条横条亮出来
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:5px 10px;display:none;' +
      'font:12px/1.4 ui-monospace,Consolas,monospace;color:#333;background:#fff8d6;' +
      'border-top:1px solid #e8dca8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    function put(msg, bad) {
      bar.textContent = msg;
      bar.style.display = 'block';
      if (bad) { bar.style.background = '#ffe3e3'; bar.style.color = '#8b1a1a'; bar.style.borderTopColor = '#e59a9a'; }
    }
    document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(bar); });
    window.addEventListener('error', function (e) {
      put('[error] ' + (e.message || '') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?') +
        (e.error && e.error.stack ? ' | ' + String(e.error.stack).slice(0, 300) : ''), true);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      put('[reject] ' + String((r && (r.stack || r.message)) || r).slice(0, 300), true);
    });
    setTimeout(function () {
      var root = document.getElementById('root');
      var goMain = window.go && window.go.main && window.go.main.App;
      var n = root ? root.innerHTML.length : -1;
      var methods = goMain ? Object.keys(goMain).length : 0;
      if (!root) { put('[boot][构建 3.0.28] 找不到 #root', true); return; }
      if (!window.go) {
        put('[boot][构建 3.0.28] window.go 缺失（Wails 绑定未注入）· root=' + n + ' · theme=' + (document.documentElement.dataset.theme || 'none'), true);
        return;
      }
      if (n < 50) {
        put('[boot][构建 3.0.28] React 未渲染 · root=' + n + ' · go方法=' + methods, true);
        return;
      }
      // 一切正常就什么都不显示，只留一条控制台日志
      try { console.log('[boot][构建 3.0.28] 启动正常 · go方法=' + methods + ' · root=' + n) } catch (e) {}
    }, 1500);
  })();
</script>

</body>
</html>
