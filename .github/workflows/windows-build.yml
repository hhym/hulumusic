name: Windows 构建

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建界面
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build

      - name: 拼回 page.html
        run: python scripts/build-page.py

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译 exe
        run: go build -ldflags "-H windowsgui" -o hulu-music.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: hulumusic-windows
          path: hulu-music.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: hulu-music.exe
          generate_release_notes: true
